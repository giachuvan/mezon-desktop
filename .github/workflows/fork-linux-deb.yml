name: Fork Linux .deb

# Build a tester-ready .deb on Ubuntu 22.04 (glibc 2.35) from any fork branch.
# NX_* env block mirrors local .env (fork-only — do not merge to upstream).
#
# Usage:
#   1. Push your branch to your fork
#   2. Actions → "Fork Linux .deb" → Run workflow (or wait for push)
#   3. Download artifact "mezon-linux-deb" → send mezon_*.deb to testers
#   4. Tester: double-click .deb → Install → open Mezon from app menu

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: fork-linux-deb-${{ github.ref }}
  cancel-in-progress: true

