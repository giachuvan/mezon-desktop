jobs:
  linux-deb:
    name: Linux .deb (ubuntu 22.04)
    runs-on: ubuntu-latest
    container: ubuntu:22.04

    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl openssl zstd

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Linux build dependencies
        run: bash scripts/linux-deps

      - name: Build release binary
        run: cargo build --release -p mezon-app --locked

      - name: Build .deb package
        run: |
          cargo install cargo-deb --locked
          cargo deb -p mezon-app --locked
          mkdir -p dist
          cp target/debian/mezon_*.deb dist/
          cp target/release/mezon dist/mezon
          echo "## Tester package" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download artifact **mezon-linux-deb**, then send \`mezon_*.deb\` to testers." >> "$GITHUB_STEP_SUMMARY"
          echo "Tester: double-click the .deb → Install → open Mezon from the app menu." >> "$GITHUB_STEP_SUMMARY"
          ls -la dist/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mezon-linux-deb
          path: dist/*
          if-no-files-found: error
          retention-days: 14
